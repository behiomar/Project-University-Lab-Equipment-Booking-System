<div class="home">

  <p class="state-msg" *ngIf="loading()">Loading equipment...</p>

  <ng-container *ngIf="!loading()">

    <section class="block">
      <div class="block-head">
        <h2>Latest Equipment</h2>
        <p>Recently added to the platform</p>
      </div>

      <p class="state-msg" *ngIf="latest().length === 0">No equipment yet.</p>

      <div class="grid">
        <ng-container *ngFor="let e of latest()">
          <ng-container *ngTemplateOutlet="card; context: { $implicit: e }"></ng-container>
        </ng-container>
      </div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Most Available</h2>
        <p>Equipment with the highest stock</p>
      </div>

      <p class="state-msg" *ngIf="mostAvailable().length === 0">No available equipment.</p>

      <div class="grid">
        <ng-container *ngFor="let e of mostAvailable()">
          <ng-container *ngTemplateOutlet="card; context: { $implicit: e }"></ng-container>
        </ng-container>
      </div>
    </section>

  </ng-container>

</div>

<ng-template #card let-e>
  <div class="card">

    <div class="card-image">
      <button
        type="button"
        class="fav-btn"
        [class.active]="isFavorite(e.id)"
        (click)="toggleFavorite(e.id)"
        aria-label="Favorite">
        {{ isFavorite(e.id) ? '♥' : '♡' }}
      </button>

      <img *ngIf="e.image" [src]="imageBase + e.image" [alt]="e.name">

      <div class="no-image" *ngIf="!e.image">🔬</div>
    </div>

    <div class="card-body">
      <span class="tag">{{ e.category }}</span>
      <h3>{{ e.name }}</h3>
      <p class="desc">{{ e.description }}</p>

      <div class="meta">
        <span class="qty">Qty: <strong>{{ e.quantity }}</strong></span>
        <span class="status"
          [class.ok]="e.status === 'Available'"
          [class.ko]="e.status !== 'Available'">
          {{ e.status }}
        </span>
      </div>

      <a class="view-btn" [routerLink]="['/equipment', e.id]">Book</a>
    </div>

  </div>
</ng-template>
